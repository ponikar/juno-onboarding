      - tapOn: "Manage flare days"
- tapOn: "Continue"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible: "Not having a name for it is hard.*"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Still looking for answers"
- tapOn: "Continue"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/08-symptoms
- assertVisible: "Add 2 symptoms"
- tapOn: "None right now"
- tapOn: "Continue"
- waitForAnimationToEnd
