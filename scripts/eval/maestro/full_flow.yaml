# J-01, J-04, J-08, J-11, T-07, T-08: one full run typing the test entry and taking every escape option.
# Start state: open exp://127.0.0.1:8082/--/welcome?preset=empty&fresh=1 first (scripts/eval/maestro/run.sh does it).
appId: host.exp.Exponent
---
- repeat:
    times: 4
    while:
      notVisible:
        id: "story-cta"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Try it now"
- waitForAnimationToEnd
- tapOn:
    id: "story-cta"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible:
        id: "consent-continue"
        enabled: true
    commands:
      - waitForAnimationToEnd
      - tapOn: ".*I agree to the.*"
- tapOn:
    id: "consent-continue"
- waitForAnimationToEnd
- inputText: "tired and my head hurts"
- tapOn:
    id: "try-continue"
- waitForAnimationToEnd
- assertVisible: "Fatigue"
- assertVisible: "Headaches"
- takeScreenshot: docs/evals/e2e/04-heard
- tapOn:
    id: "heard-continue"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible: "1 selected"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Manage flare days"
- tapOn: "Continue"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible: "Not having a name for it is hard.*"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Still looking for answers"
- tapOn: "Continue"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/07-symptoms
- assertVisible: "Add 2 symptoms"
- tapOn: "None right now"
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Add later"
- waitForAnimationToEnd
- assertVisible: "What I know so far"
- takeScreenshot: docs/evals/e2e/10-insight-health
- tapOn: "Keep going"
- waitForAnimationToEnd
- tapOn: "None booked"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/09-after-none-booked
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "No one right now"
- takeScreenshot: docs/evals/e2e/13-support-no-one
- tapOn: "Continue"
- waitForAnimationToEnd
- assertVisible: "What I know so far"
- takeScreenshot: docs/evals/e2e/14-insight-days
- tapOn: "Keep going"
- waitForAnimationToEnd
- tapOn: "Prefer not to say"
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Maybe later"
- waitForAnimationToEnd
- tapOn: "Not sure yet"
- takeScreenshot: docs/evals/e2e/17-promise
- tapOn: "Keep going"
- extendedWaitUntil:
    visible: "See my doctor page"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/19-snapshot
- tapOn: "See my doctor page"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/20-report
- scrollUntilVisible:
    element: "What this page becomes"
- takeScreenshot: docs/evals/e2e/20-report-projection
- tapOn: "Save my snapshot"
- waitForAnimationToEnd
- tapOn: "Continue with Apple"
- extendedWaitUntil:
    visible: "See my plan"
    timeout: 10000
- tapOn: "See my plan"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/23-plans
- tapOn: "Continue with the free plan"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/24-notify
