# J-01, J-04, J-08, J-11, T-07, T-08: one full run typing the test entry and taking every escape option.
# Start state: open exp://127.0.0.1:8082/--/welcome?preset=empty&fresh=1 first (scripts/eval/maestro/run.sh does it).
appId: host.exp.Exponent
---
- repeat:
    times: 4
    while:
      notVisible:
        id: "story-next"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Try it now"
- waitForAnimationToEnd
- assertVisible: "Months to get an appointment. Then 15 minutes."
- takeScreenshot: docs/evals/e2e/02-story-1
- repeat:
    times: 4
    while:
      notVisible: "We know because we lived it."
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "story-next"
- assertVisible: "We know because we lived it."
- repeat:
    times: 4
    while:
      notVisible: "So we built Juno to keep the record."
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "story-next"
- assertVisible: "So we built Juno to keep the record."
- takeScreenshot: docs/evals/e2e/02-story-3
- tapOn: "Show me how"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible:
        id: "consent-continue"
        enabled: true
    commands:
      - waitForAnimationToEnd
      - tapOn: ".*I agree to the.*"
- tapOn:
    id: "consent-continue"
- waitForAnimationToEnd
- inputText: "tired and my head hurts"
- tapOn:
    id: "try-continue"
- waitForAnimationToEnd
- assertVisible: "Fatigue"
- assertVisible: "Headaches"
- takeScreenshot: docs/evals/e2e/05-heard
- tapOn:
    id: "heard-continue"
- waitForAnimationToEnd
- repeat:
