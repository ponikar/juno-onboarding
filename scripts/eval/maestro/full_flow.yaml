# J-01, J-04, J-08, J-11, T-07, T-08: one full run typing the test entry and taking every escape option.
# Start state: open exp://127.0.0.1:8082/--/welcome?preset=empty&fresh=1 first (scripts/eval/maestro/run.sh does it).
appId: host.exp.Exponent
---
- repeat:
    times: 4
    while:
      notVisible:
        id: "story-next"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Try it now"
- waitForAnimationToEnd
- assertVisible: "Months to get an appointment. Then 15 minutes."
- takeScreenshot: docs/evals/e2e/02-story-1
- tapOn:
    id: "story-next"
- waitForAnimationToEnd
- assertVisible: "We know because we lived it."
- tapOn:
    id: "story-next"
- waitForAnimationToEnd
- assertVisible: "So we built Juno to keep the record."
- takeScreenshot: docs/evals/e2e/02-story-3
- tapOn: "Show me how"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible:
        id: "consent-continue"
        enabled: true
    commands:
      - waitForAnimationToEnd
      - tapOn: ".*I agree to the.*"
- tapOn:
    id: "consent-continue"
- waitForAnimationToEnd
- inputText: "tired and my head hurts"
- tapOn:
    id: "try-continue"
- waitForAnimationToEnd
- assertVisible: "Fatigue"
- assertVisible: "Headaches"
- takeScreenshot: docs/evals/e2e/05-heard
- tapOn:
    id: "heard-continue"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible: "1 selected"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Manage flare days"
- tapOn: "Continue"
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible: "Not having a name for it is hard.*"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Still looking for answers"
- tapOn: "Continue"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/08-symptoms
- assertVisible: "Add 2 symptoms"
- tapOn: "None right now"
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Add later"
- waitForAnimationToEnd
- assertVisible: "What I know so far"
- assertVisible: "Your doctor page"
- takeScreenshot: docs/evals/e2e/10-insight-health
- tapOn: "Keep going"
- waitForAnimationToEnd
- tapOn: "None booked"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/11-after-none-booked
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "No one right now"
- takeScreenshot: docs/evals/e2e/13-support-no-one
- tapOn: "Continue"
- waitForAnimationToEnd
- assertVisible: "What I know so far"
- assertVisible: "Your doctor page"
- takeScreenshot: docs/evals/e2e/14-insight-days
- tapOn: "Keep going"
- waitForAnimationToEnd
- tapOn: "Prefer not to say"
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Maybe later"
- waitForAnimationToEnd
- tapOn: "Not sure yet"
- takeScreenshot: docs/evals/e2e/17-promise
- tapOn: "Keep going"
- extendedWaitUntil:
    visible: "Got it"
    timeout: 10000
- assertVisible: "Here's tomorrow's check-in"
- takeScreenshot: docs/evals/e2e/19-demo
- tapOn: "Got it"
- waitForAnimationToEnd
- takeScreenshot: docs/evals/e2e/20-notify
- tapOn: "Not now"
- extendedWaitUntil:
